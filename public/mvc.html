<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVC Architecture</title>
</head>
<body style="background-color: black; color: white; font-family: Arial, sans-serif; text-align: center;">

    <h2 style="margin-bottom: 30px;">Model-View-Controller Architecture</h2>

    <div style="display: flex; justify-content: space-between; padding: 20px;">
        <!-- User Section -->
        <div style="flex: 1; text-align: center;">
            <img src="https://cdn-icons-png.flaticon.com/512/1042/1042112.png" alt="User Icon" width="80">
            <h3>User</h3>
            <p style="font-size: 14px;">Requests & Responses</p>
        </div>

        <!-- MVC Diagram -->
        <div style="flex: 3; position: relative;">
            <!-- Controller -->
            <div style="background-color: #124f56; border: 2px solid cyan; padding: 20px; width: 150px; text-align: center; font-weight: bold; position: absolute; left: 50%; top: 20%; transform: translateX(-50%);">
                Controller
            </div>

            <!-- View -->
            <div style="background-color: #403c1d; border: 2px solid yellow; padding: 20px; width: 150px; text-align: center; font-weight: bold; position: absolute; left: 20%; top: 60%;">
                View
            </div>

            <!-- Model -->
            <div style="background-color: #3a1e1e; border: 2px solid red; padding: 20px; width: 150px; text-align: center; font-weight: bold; position: absolute; right: 20%; top: 60%;">
                Model
            </div>

            <!-- Arrows and Text -->
            <p style="position: absolute; left: 35%; top: 35%; font-size: 12px;">Dynamically rendered view elements (HTML, JSON, XML, etc.)</p>
            <p style="position: absolute; right: 30%; top: 35%; font-size: 12px;">Calls to logic methods, Active Record relationships</p>
            <p style="position: absolute; left: 50%; bottom: 10%; transform: translateX(-50%); font-size: 12px;">Formatted data (arrays, hashes, strings, etc.)</p>
        </div>

        <!-- Database Section -->
        <div style="flex: 1; text-align: center;">
            <img src="https://cdn-icons-png.flaticon.com/512/1261/1261163.png" alt="Database Icon" width="80">
            <h3>Database</h3>
            <p style="font-size: 14px;">Queries & Responses</p>
        </div>
    </div>

</body>
</html>
